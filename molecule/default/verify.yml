---
- name: Verify ConvertX systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for ConvertX service to become active (up to 180s)
      ansible.builtin.systemd:
        name: convertx.service
      register: convertx_service
      until: convertx_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert ConvertX service is active
      ansible.builtin.assert:
        that: convertx_service.status.ActiveState == 'active'
        fail_msg: "convertx.service not active ({{ convertx_service.status.ActiveState }})"
        success_msg: "convertx.service is active"

    - name: Retrieve ConvertX service log for debugging
      when: convertx_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu convertx.service
      changed_when: false

    - name: Wait for ConvertX HTTP endpoint to respond (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:3000/"
        method: GET
        status_code: [200, 302]
        follow_redirects: none
      register: convertx_endpoint
      until: convertx_endpoint.status in [200, 302]
      retries: 120
      delay: 5

    - name: Assert ConvertX HTTP endpoint responds
      ansible.builtin.assert:
        that: convertx_endpoint.status in [200, 302]
        fail_msg: "ConvertX did not respond as expected ({{ convertx_endpoint.status | default('no response') }})"
        success_msg: "ConvertX responded with {{ convertx_endpoint.status }}"

    - name: Show ConvertX systemd service status summary
      ansible.builtin.debug:
        msg:
          - "ConvertX systemd: {{ convertx_service.status.ActiveState }}"
          - "ConvertX HTTP: {{ convertx_endpoint.status }}"
